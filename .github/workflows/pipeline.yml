name: COP / Polaris Scan Pipeline (Python)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Which platform to scan against"
        required: true
        default: cop
        type: choice
        options:
          - cop
          - polaris

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Create coverity.yaml
        shell: bash
        run: |
          CAPTURE_KEY="capture"
          ANALYZE_KEY="analyze"
          cat > coverity.yaml << EOF
          ${CAPTURE_KEY}:
            files:
              exclude-regex: '((\.venv|__pycache__|\.git)/.*)'
          ${ANALYZE_KEY}:
            cov-analyze-args:
              - '--webapp-security'
              - '--security'
              - '--enable'
              - 'HARDCODED_CREDENTIALS'
              - '--enable'
              - 'SQLI'
              - '--enable'
              - 'OS_CMD_INJECTION'
          EOF
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Polaris/Coverity CLI reads a fixed config filename (.polaris.yml).
      # This repo keeps the config as COP.yml so it's easy to spot in this test harness;
      # copy it into place before invoking the CLI.

      - name: Stage COP.yml as .polaris.yml
        run: cp COP.yml .polaris.yml
