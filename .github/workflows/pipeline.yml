name: COP / Polaris Scan Pipeline (Python)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Which platform to scan against"
        required: true
        default: cop
        type: choice
        options:
          - cop
          - polaris

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Create coverity.yaml
        shell: bash
        run: |
          cat > coverity.yaml << 'EOF'
          capture:
            files:
              exclude-regex: '((\.venv|__pycache__|\.git)/.*)'
          analyze:
            cov-analyze-args:
              - '--webapp-security'
              - '--security'
              - '--enable'
              - 'HARDCODED_CREDENTIALS'
              - '--enable'
              - 'SQLI'
              - '--enable'
              - 'OS_CMD_INJECTION'
          EOF
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Polaris/Coverity CLI reads a fixed config filename (.polaris.yml).
      # This repo keeps the config as COP.yml so it's easy to spot in this test harness;
      # copy it into place before invoking the CLI.

      - name: Polaris Black Duck Security Scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_assessment_types: "SAST,SCA"
          polaris_application_name: "BN-cop-test-python-app1"
          polaris_project_name: "bn-dhiraj-chaudhary/BN-cop-test-python"
      - name: Stage COP.yml as .polaris.yml
        run: cp COP.yml .polaris.yml
